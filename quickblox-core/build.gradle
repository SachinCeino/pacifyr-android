apply plugin: 'com.android.library'

android {
    compileSdkVersion rootProject.compileSdkVersion
    buildToolsVersion rootProject.buildToolsVersion
    /*   compileSdkVersion 25
       buildToolsVersion "26.0.1"*/

    defaultConfig {
        /*     minSdkVersion 16
             targetSdkVersion 25*/
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        repositories {
            maven {
                url "https://github.com/QuickBlox/quickblox-android-sdk-releases/raw/master/"
            }
            maven {
                url "http://dl.bintray.com/ahmedrizwan/maven"
            }
            maven { url "https://jitpack.io" }
        }
        debug{

        }
        release {
            minifyEnabled false
//            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'

            // minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), "proguard-rules.pro"

            //Other parameters
            /* debuggable false
             jniDebuggable false
             renderscriptDebuggable false
             pseudoLocalesEnabled false
             zipAlignEnabled true*/
        }
        /*lintOptions {
            // set to true to turn off analysis progress reporting by lint
            quiet true
            // if true, stop the gradle build if errors are found
            abortOnError false
            // if true, only report errors
            ignoreWarnings true
        }
*/
        /*splits {
            density {
                enable true
                exclude "ldpi", "tvdpi", "xxxhdpi"
                compatibleScreens 'small', 'normal', 'large', 'xlarge'
            }

            abi {
                enable false
                include 'x86', 'armeabi-v7a', 'arm64-v8a', 'x86_64'
                exclude "armeabi", "mips", "mips64"
                universalApk true
            }
        }*/
        /*applicationVariants.all { variant ->
            variant.outputs.each { output ->
                def lintTask = tasks["lint${variant.name.capitalize()}"]
                output.assemble.dependsOn lintTask
            }
        }*/

//        debug {
//            signingConfig signingConfigs.debug
//        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    //   buildToolsVersion '26.0.2'
}

dependencies {
    //compile ("com.quickblox:quickblox-android-sdk-messages:$rootProject.qbSdkVersion")
    implementation (("com.quickblox:quickblox-android-sdk-messages:$rootProject.qbSdkVersion" )){
        exclude group : 'com.android.support'
    }
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.0'
    // compile "com.github.johnkil.android-robototextview:robototextview:${rootProject.robotoTextViewVersion}"

}
