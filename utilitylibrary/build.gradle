    //implementation 'com.nex3z:flow-layout:0.1.4'
    implementation 'io.github.francoiscampbell:circlelayout:0.3.0'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation project(':quickblox-core')
    implementation project(':quickblox-videochat-webrtc')
    implementation project(':quickblox-chat')

