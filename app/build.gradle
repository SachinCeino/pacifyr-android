                    'proguard-rules.pro'

            // minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), "proguard-rules.pro"

            applicationVariants.all { variant ->
                variant.outputs.all {
                    def date = new Date()
                    def formattedDate = date.format('MMM_dd_HHmmss')
                    def flavor = variant.productFlavors[0].name
                    outputFileName = "${flavor}_${variant.buildType.name}_${variant.versionName}_${formattedDate}_.apk"
                }
            }
        }
