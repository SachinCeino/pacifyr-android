apply plugin: 'com.android.application'

android {
    compileSdkVersion 26
    buildToolsVersion "26.0.2"
    defaultConfig {
        applicationId "com.pacifyr.omhealthcare"
        minSdkVersion 16
        // minSdkVersion 21
        targetSdkVersion 26
        versionCode 5
        versionName "1.2"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        resConfigs "en", "hi"
    }
    buildTypes {
        repositories {
            maven {
                url "https://github.com/QuickBlox/quickblox-android-sdk-releases/raw/master/"
            }
            maven {
                url "http://dl.bintray.com/ahmedrizwan/maven"
            }
            maven { url "https://jitpack.io" }
        }
        release {
//            minifyEnabled true
//            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'

            // minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), "proguard-rules.pro"

            //Other parameters
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
            zipAlignEnabled true
        }
        lintOptions {
            // set to true to turn off analysis progress reporting by lint
            quiet true
            // if true, stop the gradle build if errors are found
            abortOnError false
            // if true, only report errors
            ignoreWarnings true
        }

        splits {
            density {
                enable true
                exclude "ldpi", "tvdpi", "xxxhdpi"
                compatibleScreens 'small', 'normal', 'large', 'xlarge'
            }

            abi {
                enable false
                include 'x86', 'armeabi-v7a', 'arm64-v8a', 'x86_64'
                exclude "armeabi", "mips", "mips64"
                universalApk true
            }
        }
        applicationVariants.all { variant ->
            variant.outputs.each { output ->
                def lintTask = tasks["lint${variant.name.capitalize()}"]
                output.assemble.dependsOn lintTask
            }
        }

//        debug {
//            signingConfig signingConfigs.debug
//        }
    }

    //Here the magic Begins
//    lintOptions {
//        checkReleaseBuilds false
//        abortOnError false
//    }

    dexOptions {
        preDexLibraries true
        javaMaxHeapSize "4g" // 2g should be also OK
    }

//    signingConfigs {
//        debug {
//            storeFile file(project.property("MyApp.signing"))
//            storePassword project.property("MyApp.signing.password")
//            keyAlias project.property("MyApp.signing.alias")
//            keyPassword project.property("MyApp.signing.password")
//        }
//    }


}

repositories {
    jcenter()
    google()
    mavenCentral() // add repository
    maven { url 'https://maven.google.com' }
    maven {
        url "https://jitpack.io"
    }
}

