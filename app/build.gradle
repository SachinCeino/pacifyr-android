def renameAPK(variant, defaultConfig, buildType) {
    variant.outputs.all { output ->
        def formattedDate = new Date().format('dd-MM-yy')

//        def file = output.packageApplication.outputFile
        def fileName = buildType + "_" + applicationName + "_" + formattedDate + ".apk"
        def relativeRootDir = output.packageApplication.outputDirectory.toPath()
                .relativize(rootDir.toPath()).toFile()
        outputFileName = new File("$relativeRootDir/release", fileName)
//        output.packageApplication.outputFileName = new File(file.parent, fileName)
    }
}

