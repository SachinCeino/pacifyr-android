            }
        }*/

//        debug {
//            signingConfig signingConfigs.debug
//        }
    }

    // Specifies one flavor dimension.
    flavorDimensions "Pacifyr"
    productFlavors {
        omwellbeing {
            // Assigns this product flavor to the "version" flavor dimension.
            // This property is optional if you are using only one dimension.
            dimension "Pacifyr"
            applicationId "com.ceino.pacifyr.omhealthcare"
            versionName "1.4"
            versionCode 20
        }
        pacifyrclient {
            dimension "Pacifyr"
            applicationId "com.pacifyr.pacifyrapp"
            versionName "2.4.19"
            versionCode 176
        }
        leadersup {
            dimension "Pacifyr"
            applicationId "com.pacifyr.leadersup"
            versionName "1.1.1"
            versionCode 5
        }
        pamapp {
            dimension "Pacifyr"
            applicationId "com.pacifyr.pam"
            versionName "1.0.5"
            versionCode 4
        }
    }


    //Here the magic Begins
//    lintOptions {
//        checkReleaseBuilds false
//        abortOnError false
//    }

    dexOptions {
        preDexLibraries true
        javaMaxHeapSize "4g" // 2g should be also OK
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
