// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://jcenter.bintray.com/" }
        maven { url "https://repo.maven.apache.org/maven2" }
        maven { url "https://maven.google.com" }
        maven {
            url "https://github.com/QuickBlox/quickblox-android-sdk-releases/raw/master/"
        }
        maven {
            url 'https://maven.fabric.io/public'
        }

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.0.1'
        /*  classpath 'com.google.gms:google-services:3.1.0'*/


        classpath 'com.google.gms:google-services:4.3.2'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath 'io.fabric.tools:gradle:1.31.0'
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven {
            url "https://github.com/QuickBlox/quickblox-android-sdk-releases/raw/master/"
        }
        maven {
            url 'https://maven.google.com/'
        }
    }
}

ext {
/*    compileSdkVersion = 25
    buildToolsVersion = "25.0.2"*/

    compileSdkVersion = 26
    buildToolsVersion = "26.0.2"
    minSdkVersion = 16
    // minSdkVersion = 21
    targetSdkVersion = 26

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    lintAbortOnError = false

    // QuickBlox SDK version
    qbSdkVersion = '3.9.2'

    versionName = '3.3.0'

    testRunnerVersion = "0.4.1"


    // Dependency versions
    /* playServicesVersion = '10.2.1'*/
    playServicesVersion = '11.4.2'
    supportV4Version = '26.1.0'
    appcompatV7Version = '26.1.0'
    recyclerviewV7Version = '26.1.0'
    supportAnnotationsVersion = '26.1.0'
    designVersion = '26.1.0'

    uilVersion = '1.9.0'
    glideVersion = '3.6.1'
    pullToRefreshVersion = '3.2.3'
    stickyListHeaders = '2.7.0'
    robotoTextViewVersion = '2.4.3'
    stickersVersion = '0.7.3'
    crashlyticsVersion = '2.2.2'
}
task clean(type: Delete) {
    delete rootProject.buildDir
}
